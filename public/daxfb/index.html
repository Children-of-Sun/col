    <!-- Pre-seed settings: enable scroll-to-zoom and drag-and-drop -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('settings-coi') || '{}');
        s.scrollScaleEnabled = true;
        s.dragAndDropEnabled = true;
        s.scale = s.scale || 1;
        localStorage.setItem('settings-coi', JSON.stringify(s));
      } catch(e) {}
    </script>
    <!--
      Cursor-centered zoom override. Uses capture-phase event interception
      (NOT cloneNode) to preserve drag-and-drop handlers on the surface.
      daxfb's Vue onWheel handler runs in bubble phase, so capture-phase
      stopPropagation() prevents it cleanly.
    -->
    <script>
    (function() {
      var SCALE_MIN = 0.2, SCALE_MAX = 2.0, SCALE_STEP = 0.1;
      var RETRY_MS = 200, MAX_RETRIES = 30;

      function fixZoom() {
        var surface = document.querySelector('.blueprint-surface');
        var collection = document.querySelector('.blueprint-collection');
        if (!surface || !collection) return false;

        // Read current scale from CSS transform (set by daxfb or us)
        function getScale() {
          var t = collection.style.transform || '';
          var m = t.match(/scale\(([\d.]+)\)/);
          return m ? parseFloat(m[1]) : 1;
        }

        // Set scale on collection element + sync to localStorage
        function setScale(v) {
          v = Math.min(SCALE_MAX, Math.max(SCALE_MIN, v));
          v = Math.round(v * 100) / 100;
          collection.style.transform = 'scale(' + v + ')';
          try {
            var st = JSON.parse(localStorage.getItem('settings-coi') || '{}');
            st.scale = v;
            localStorage.setItem('settings-coi', JSON.stringify(st));
          } catch(e) {}
        }

        // Capture-phase wheel handler — fires BEFORE daxfb's bubble handler.
        // stopPropagation() prevents daxfb's handler entirely, so we take over
        // zoom completely. No cloneNode means pointer/mouse handlers stay intact.
        surface.addEventListener('wheel', function(e) {
          if (!e.ctrlKey && !e.metaKey) {
            var rect = surface.getBoundingClientRect();
            var oldScale = getScale();
            var newScale = e.deltaY < 0
              ? Math.min(oldScale + SCALE_STEP, SCALE_MAX)
              : Math.max(oldScale - SCALE_STEP, SCALE_MIN);
            if (newScale === oldScale) return;

            // Cursor position relative to viewport
            var mx = e.clientX - rect.left;
            var my = e.clientY - rect.top;

            // Content-space point under cursor before zoom
            var cx = (mx + surface.scrollLeft) / oldScale;
            var cy = (my + surface.scrollTop) / oldScale;

            // Apply new scale
            setScale(newScale);

            // Adjust scroll so the content point stays under cursor
            surface.scrollLeft = cx * newScale - mx;
            surface.scrollTop = cy * newScale - my;

            e.preventDefault();
            e.stopPropagation();
          }
        }, { passive: false, capture: true });

        return true;
      }

      // Retry until daxfb mounts (JS loads async)
      var tries = 0;
      function tryFix() {
        if (fixZoom()) return;
        if (++tries < MAX_RETRIES) setTimeout(tryFix, RETRY_MS);
      }
      setTimeout(tryFix, 800);
    })();
    </script>
    <!--
      UI text translation via MutationObserver.
      Watches document.body (not just #app) to catch tooltip overlays
      that are teleported outside the app root.
      This handles short strings (like "All", "None", "Delete") that
      are JavaScript identifiers and CANNOT be replaced in the JS source.
      The JS patch (patchDaxfbJs.mjs) handles long unique strings.
    -->
    <script>
    (function() {
      var MAP = {
        // Top toolbar
        'Solve':'求解','Clear':'清除','Settings':'设置','Scale':'缩放',
        'Theme':'主题','Summary':'汇总',
        // Settings panel
        'Dark Theme':'暗色主题','Appearance':'外观','Actions':'操作',
        'Help':'帮助','About':'关于',
        // General UI
        'Filter':'筛选','Group By':'分组','Cost':'成本',
        'Close':'关闭','Delete':'删除','Lock':'锁定','Error':'错误','Warning':'警告',
        'All':'全部','None':'无','Default':'默认','Once':'一次',
        'Input':'输入','Output':'输出','Primary':'主要','Secondary':'次要',
        'Tier':'等级','Special':'特殊',
        // Item types (enum values in JS, can only translate in DOM)
        'Countable':'可计数','Item':'物品','Fluid':'流体','Gas':'气体',
        'Liquid':'液体','Solid':'固体','Molten':'熔融','Energy':'能量',
        'Module':'模块','Loose':'松散','Unknown':'未知',
        // Blueprint operations
        'Set':'设置','Target':'目标','Rows':'行','Cols':'列',
        'Basic Indexes':'基本索引','Non Basic Indexes':'非基本索引',
        'Nb Constraints':'约束数','Nb Variables':'变量数',
        'Solve Precision':'求解精度',
        // Objects
        'Map':'映射','Object':'对象','Event':'事件',
        // Other
        'Open':'打开','Auto':'自动','Layout':'布局','Count':'数量',
        'Delete all links':'删除所有连线',
        'Search recipes...':'搜索配方...',
        'Solve graph':'求解图表',
        'Load game':'加载游戏',
        'Select game':'选择游戏',
        'Save / Share Blueprint':'保存/分享蓝图',
        'Generate Link':'生成链接',
        // Vuetify component strings (JS patch covers these, but kept as fallback)
        'Badge':'徽章',
        'No matching records found':'未找到匹配记录',
        'Loading items...':'加载中...',
        'Rows per page:':'每页行数：','Items per page:':'每页项目数：',
        'No data available':'暂无数据',
        'Previous visual':'上一个','Next visual':'下一个',
        'Sort by':'排序方式',
        'Next page':'下一页','Previous page':'上一页',
        'First page':'第一页','Last page':'最后一页',
        'Next month':'下个月','Next year':'下一年',
        'Previous month':'上个月','Previous year':'上一年',
        'Pagination Navigation':'分页导航','Go to page':'前往',
        'Current page':'当前页',
        // Vuetify aria labels
        'Sorted descending.':'降序排列。','Sorted ascending.':'升序排列。',
        'Not sorted.':'未排序。',
        'Activate to remove sorting.':'激活以取消排序。',
        'Activate to sort descending.':'激活以降序排列。',
        'Activate to sort ascending.':'激活以升序排列。',
      };

      function translateText(node) {
        if (node.nodeType === 3) { // Text node
          var text = node.textContent;
          var changed = false;
          for (var k in MAP) {
            if (text.indexOf(k) !== -1) {
              text = text.split(k).join(MAP[k]);
              changed = true;
            }
          }
          if (changed) node.textContent = text;
        } else if (node.nodeType === 1 && node.childNodes) {
          for (var i = 0; i < node.childNodes.length; i++) {
            translateText(node.childNodes[i]);
          }
        }
      }

      function start() {
        // Watch document.body to catch tooltip overlays teleported outside #app
        var root = document.body;
        if (!root || !document.getElementById('app')) { setTimeout(start, 200); return; }
        // Initial translation
        translateText(root);
        // Watch for changes
        var mo = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var m = mutations[i];
            for (var j = 0; j < m.addedNodes.length; j++) {
              translateText(m.addedNodes[j]);
            }
          }
        });
        mo.observe(root, { childList: true, subtree: true, characterData: true });
      }
      setTimeout(start, 1200);
    })();
    </script>

    <div id="app"></div>
